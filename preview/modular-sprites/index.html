<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no + maximum-scale stop double-tap and pinch zooming the
         page mid-game; viewport-fit=cover lets the layout run under notches,
         which the controls then inset back out of via env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#111111" />
    <title>Zombie Emily</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        /* No page scrolling: the game is a single fixed screen, and a stray
           swipe on a phone would otherwise drag the whole document around
           (or trigger pull-to-refresh) instead of reaching the controls. */
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }
      body {
        /* dvh tracks mobile browser chrome collapsing as you scroll/rotate;
           the vh line is the fallback for browsers without dvh. */
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #app canvas {
        image-rendering: pixelated;
        /* Phaser's FIT scale mode sets the canvas's CSS size itself; this just
           stops it ever exceeding its box during an orientation change. */
        max-width: 100%;
        max-height: 100%;
        display: block;
      }
    </style>
    <script type="module" crossorigin src="/zombie-emily/preview/modular-sprites/assets/index-DROP-kIs.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
