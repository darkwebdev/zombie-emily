name: Agent comment

# Lets the coding agent post issue comments under the github-actions[bot]
# identity instead of the human account that also uses `gh` in this repo —
# see "Who's commenting" in CLAUDE.md for why that distinction matters.
# Triggered manually (gh workflow run agent-comment.yml -f issue=N -f body=...),
# never on a schedule or automatically from another event.

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to comment on"
        required: true
      body:
        description: "Comment body (markdown)"
        required: true

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          COMMENT_BODY: ${{ inputs.body }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ inputs.issue }}'),
              body: process.env.COMMENT_BODY,
            });
