name: Deploy to GitHub Pages

# Publishes main to the root of the Pages site. Branch previews live under
# preview/<branch>/ on the same site (see preview.yml and CLAUDE.md), because
# a repo only gets one Pages site.
#
# Publishing works by committing the build to the gh-pages branch rather than
# uploading a Pages artifact: an artifact deploy replaces the entire site
# every run, which would delete every live preview each time main deployed.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

# Both this and preview.yml commit to the same gh-pages branch, so they share
# one concurrency group — two jobs pushing to it at once would race and one
# would fail on a non-fast-forward.
concurrency:
  group: gh-pages-publish

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PAGES_BASE: /zombie-emily/

      - name: Publish to gh-pages root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out

          # Replace the root, but leave preview/ alone — those belong to other
          # branches and must survive a main deploy.
          find out -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name preview -exec rm -rf {} +
          cp -R dist/. out/
          # Without this, Pages runs Jekyll and drops any file or directory
          # whose name starts with an underscore.
          touch out/.nojekyll

          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Deploy main: ${GITHUB_SHA::7}"
          git push origin gh-pages
